---
- name: Set firewall rules
  block:
    - name: API server
      community.general.ufw:
        rule: allow
        port: '6443'
        proto: tcp
    
    - name: Pods and services
      community.general.ufw:
        rule: allow
        src: '{{ item }}'
      loop:
        - 10.42.0.0/16 # Pods
        - 10.43.0.0/16 # Services

- name: Download install script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/install-k3s.sh
    mode: '0700'
