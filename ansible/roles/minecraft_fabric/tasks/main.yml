---
- name: Create install directory
  ansible.builtin.file:
    path: "{{ minecraft_install_dir }}"
    state: directory
    mode: '0755'

- name: Create directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0775'
  with_items:
    - "{{ minecraft_data_dir }}"

- name: Copy docker-compose template
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ minecraft_install_dir }}/docker-compose.yml"
    mode: '0644'

- name: Ensure stack is running
  community.docker.docker_compose_v2:
    project_name: minecraft
    project_src: "{{ minecraft_install_dir }}"
    state: present
    pull: missing

- name: Ensure ports open on the firewall
  community.general.ufw:
    rule: allow
    port: "{{ minecraft_port }}"
    proto: "tcp"

- name: Ensure ports open on the firewall
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
  with_items:
    - { port: "{{ minecraft_port }}", proto: "tcp" }
    - { port: "{{ minecraft_port }}", proto: "udp" } # Gamespy Query protocol

- name: Cleanup stale Docker images
  community.docker.docker_prune:
    images: true
    images_filters:
      dangling: false
